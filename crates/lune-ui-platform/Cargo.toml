[package]
name = "lune-ui-platform"
description = "OS layer of the glass UI toolkit: the glass effect behind a transparent window, the tray item and the popover window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui-core = { path = "../lune-ui-core" }
winit = "0.30"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8.1"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSRunningApplication",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
raw-window-handle = "0.6"

[lints]
workspace = true
