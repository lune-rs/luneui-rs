[package]
name = "lune-ui-wgpu"
description = "wgpu renderer for the glass UI toolkit: one shared GPU, per-target frame renderers, window surfaces, glyphon text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui-core = { path = "../lune-ui-core" }
wgpu = "30"
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
unicode-segmentation = "1"

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
