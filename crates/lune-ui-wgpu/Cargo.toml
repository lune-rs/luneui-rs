[package]
name = "lune-ui-wgpu"
description = "wgpu renderer for the glass UI toolkit: one shared GPU, per-target frame renderers, window surfaces, glyph rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui-core = { path = "../lune-ui-core" }
wgpu = "30"
cosmic-text = "0.19"
etagere = "0.3"
lru = { version = "0.16", default-features = false }
rustc-hash = "2"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
unicode-segmentation = "1"

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
