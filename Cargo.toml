[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Shipping build: small and fast.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Size experiments only (`cargo build --profile min-size`).
[profile.min-size]
inherits = "release"
opt-level = "z"
